[project]
name = "tlc"
version = "0.1.0"
description = "AI Generated Python Modules"
dependencies = [
    "dataclasses-json>=0.6.7",
    "jinja2>=3.1.6",
    "langchain>=0.3.20",
    "langchain-anthropic>=0.3.9",
    "mistune>=3.1.2",
    "pytest>=8.3.5",
]

[tool.setuptools]
py-modules = [
    "tlc",
]

[project.scripts]
sanity-check-spec = "tlc.sanity_check_spec:main"
